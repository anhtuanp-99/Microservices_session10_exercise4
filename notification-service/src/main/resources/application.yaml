spring:
  application:
    name: notification-service

  # ===== KAFKA CONSUMER =====
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      # GROUP-ID KHÁC inventory-service → nhận TẤT CẢ message
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.pharmacy.*"
        spring.json.value.default.type: com.pharmacy.notificationservice.event.OrderEvent
        spring.json.use.type.headers: false
    listener:
      ack-mode: record
      concurrency: 3

  # ===== EMAIL SMTP GMAIL =====
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}        # đọc từ ENV hoặc để trống
    password: ${MAIL_PASSWORD:}        # Gmail App Password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8088

app:
  kafka:
    topic:
      stock-events: medicine-stock-events
  notification:
    # Bật/tắt gửi email thật. false → chỉ log ra console
    email-enabled: true
    # Email nhận thông báo (khách hàng)
    customer-email: anhtuan27tech@gmail.com

logging:
  level:
    org.springframework.kafka: INFO
    com.pharmacy.notificationservice: DEBUG